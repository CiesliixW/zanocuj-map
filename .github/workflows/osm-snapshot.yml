name: Zrzut danych OSM

# Uruchamiany ręcznie. Dane o wiatach i paleniskach zmieniają się na tyle
# rzadko, że nie ma sensu odświeżać ich z harmonogramu - wystarczy powtórzyć
# ten workflow, kiedy zrzut się zestarzeje.
#
# Źródłem jest gotowy zrzut Polski z Geofabriku, a nie Overpass. Overpass służy
# do małych zapytań na żywo; przy 66 kaflach całego kraju lustra odbijają ruch
# limitami i przebieg ciągnie się godzinami. Tutaj pobranie i przefiltrowanie
# to kilka minut, deterministycznie i bez zależności od cudzych serwerów.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zainstaluj osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Pobierz zrzut Polski z Geofabriku
        run: |
          curl -fSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o poland.osm.pbf \
            https://download.geofabrik.de/europe/poland-latest.osm.pbf
          ls -lh poland.osm.pbf

      - name: Wytnij interesujące obiekty
        run: |
          # tags-filter domyślnie dociąga obiekty referencyjne, więc linie
          # i wielokąty zachowują geometrię potrzebną do policzenia środka.
          osmium tags-filter poland.osm.pbf \
            nwr/amenity=shelter \
            nwr/tourism=picnic_site \
            nwr/leisure=firepit \
            -o filtered.osm.pbf --overwrite
          ls -lh filtered.osm.pbf

      - name: Zbuduj zrzut aplikacji
        run: |
          # Bez --omit-rs: tej opcji nie ma w każdej wersji osmium, a konwerter
          # i tak zdejmuje separator rekordów z RFC 8142.
          osmium export filtered.osm.pbf \
            -f geojsonseq \
            --add-unique-id=type_id \
            | node scripts/convert-osm-extract.mjs

      - name: Zapisz zrzut w repozytorium
        run: |
          if git diff --quiet -- public/osm-poland.json; then
            echo "Zrzut bez zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/osm-poland.json
          git commit -m "Update OSM snapshot for Poland"
          git push
